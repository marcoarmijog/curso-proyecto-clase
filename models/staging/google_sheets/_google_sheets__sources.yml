version: 2

sources:
  - name: google_sheets
    database: "{{ env_var('DBT_MARMIJO', 'DEV_BRONZE_DB') }}"
    schema: google_sheets
    tables:
      - name: budget
        description: "Tabla de presupuestos importada desde Google Sheets."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: _row
            description: "Número de fila original en la hoja de cálculo."
          - name: product_id
            description: "Identificador único del producto."
          - name: quantity
            description: "Cantidad asociada al presupuesto."
          - name: month
            description: "Mes correspondiente al registro."
          - name: _fivetran_synced
            description: "Timestamp de la última sincronización por Fivetran."
          - name: _loaded_at
            description: "Timestamp de carga de los datos."