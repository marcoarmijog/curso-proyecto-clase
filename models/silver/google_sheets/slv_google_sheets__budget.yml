models:
  - name: slv_google_sheets__budget
    description: Presupuesto de Bronze renombrado y casteado.
    columns:
      - name: budget_id
        description: Identificador de fila de la hoja (_row en origen).
        data_tests:
            - not_null
            - unique
      - name: product_id
        description: Id del producto asociado al presupuesto
        data_tests:
            - not_null
            - relationships:
                arguments:
                    to: ref('products')
                    field: product_id
      - name: quantity_budgeted
        description: Cantidad presupuestada
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false